<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- A full tab, not Chrome's small embedded options box: easier to read and zoom. -->
    <meta name="manifest.open_in_tab" content="true" />
    <title>VisioFix settings</title>
  </head>
  <body>
    <div id="app"></div>
    <!-- Outside #app, so it survives re-renders: screen readers announce changes
         only in a status region that was already on the page. -->
    <div id="announcer" role="status" class="visually-hidden"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
